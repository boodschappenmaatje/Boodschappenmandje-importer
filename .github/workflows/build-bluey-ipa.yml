name: Build Bluey IPA

on:
  push:
    branches:
      - bluey-ipa-build-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bluey-ipa:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Clone Bluey source
        run: |
          git clone --depth 1 https://github.com/rbrown101010/bluey-by-riley.git "$RUNNER_TEMP/bluey"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iPhone app
        working-directory: ${{ runner.temp }}/bluey
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/BlueyBuild"
          xcodebuild \
            -project GooglyEyes.xcodeproj \
            -target GooglyEyes \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/BlueyBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/BlueyBuild" -maxdepth 2 -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            find "$RUNNER_TEMP/BlueyBuild" -maxdepth 3 -print
            exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry Bluey-unsigned.ipa Payload
          ls -lh Bluey-unsigned.ipa

      - name: Upload Bluey IPA
        uses: actions/upload-artifact@v4
        with:
          name: Bluey-unsigned-ipa
          path: ${{ runner.temp }}/Bluey-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
