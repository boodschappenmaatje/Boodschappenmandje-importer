name: Hoogvliet dagelijkse catalogusretry

on:
  schedule:
    # Vaste UTC-watchdogkandidaten rond 06:00 Europe/Amsterdam. Beide zijn
    # veilig: buiten het lokale dagvenster doet inspect:daily niets; binnen
    # het venster controleert het de schedule-runregistratie. Workflow-
    # concurrency en de bestaande catalog_import_runs-lock voorkomen overlap.
    - cron: "17 4 * * *"
    - cron: "17 5 * * *"
    # Drie kansen na de primaire import om 06:00 en bewaking om 08:30 NL.
    # 08:17/13:17/18:17 UTC = 10:17/15:17/20:17 CEST of
    # 09:17/14:17/19:17 CET. Minstens vijf uur tussen retries; de
    # persistente dagstatus beslist of er werkelijk een attempt nodig is.
    - cron: "17 8,13,18 * * *"

permissions:
  contents: read

concurrency:
  group: hoogvliet-supabase-update
  cancel-in-progress: false

jobs:
  retry-if-due:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PLANNER_CACHE_BASE_URL: https://boodschappenmaatje-pwa.vercel.app
      PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      HEADLESS: "1"
      UPDATE_MODE: maintenance
      CATALOG_BATCH: growth
      MAINTENANCE_MAX_LISTING_WINDOWS: "800"
      MAINTENANCE_MAX_DETAIL_FALLBACKS: "500"
      NAVIGATION_RETRIES: "2"
      IMPORT_TRIGGER: schedule
      DAILY_IMPORT_END_HOUR: "23"

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Controleren of een attempt verschuldigd is
        id: due
        shell: bash
        run: |
          set -euo pipefail
          decision="$(npm run --silent inspect:daily)"
          echo "$decision"
          run_attempt="$(printf '%s\n' "$decision" | sed -n 's/^run_attempt=//p' | tail -1)"
          reason="$(printf '%s\n' "$decision" | sed -n 's/^reason=//p' | tail -1)"
          if [[ "$run_attempt" != "1" ]]; then
            run_attempt="0"
          fi
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "reason=${reason:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Chromium installeren
        if: steps.due.outputs.run_attempt == '1'
        run: npx playwright install --with-deps chromium

      - name: Verschuldigde daily attempt uitvoeren
        if: steps.due.outputs.run_attempt == '1'
        run: npm run import:daily

      - name: Retrystatus samenvatten
        if: always()
        run: |
          {
            echo '## Dagelijkse volledige catalogusmaintenance'
            echo "Attempt uitgevoerd: ${{ steps.due.outputs.run_attempt }}"
            echo "Beslissing: ${{ steps.due.outputs.reason }}"
            echo 'Een retry beoordeelt opnieuw de volledige actuele listingset; er is geen nieuw-productdoel.'
            echo 'Last-known-good blijft bij een tijdelijke bronstoring beschikbaar.'
          } >> "$GITHUB_STEP_SUMMARY"
