name: Hoogvliet dagelijkse catalogusretry

on:
  schedule:
    # Vaste UTC-watchdogkandidaten: ieder heel uur van 04:17 t/m 20:17 UTC
    # (06:17-22:17 CEST, 05:17-21:17 CET). GitHub start geplande runs soms
    # uren te laat of slaat ze over; met een kans per uur maakt dat niet uit.
    # inspect:daily beslist per kans of er werkelijk een attempt nodig is:
    # buiten het dagvenster of na een complete run vandaag doet hij niets.
    # Workflow-concurrency en de catalog_import_runs-lock voorkomen overlap.
    - cron: "17 4-20 * * *"

permissions:
  contents: read

concurrency:
  group: hoogvliet-supabase-update
  cancel-in-progress: false

jobs:
  retry-if-due:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PLANNER_CACHE_BASE_URL: https://boodschappenmaatje-pwa.vercel.app
      PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      HEADLESS: "1"
      UPDATE_MODE: maintenance
      CATALOG_BATCH: growth
      MAINTENANCE_MAX_LISTING_WINDOWS: "800"
      MAINTENANCE_MAX_DETAIL_FALLBACKS: "500"
      NAVIGATION_RETRIES: "2"
      IMPORT_TRIGGER: schedule
      DAILY_IMPORT_END_HOUR: "23"

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Controleren of een attempt verschuldigd is
        id: due
        shell: bash
        run: |
          set -euo pipefail
          decision="$(npm run --silent inspect:daily)"
          echo "$decision"
          run_attempt="$(printf '%s\n' "$decision" | sed -n 's/^run_attempt=//p' | tail -1)"
          reason="$(printf '%s\n' "$decision" | sed -n 's/^reason=//p' | tail -1)"
          if [[ "$run_attempt" != "1" ]]; then
            run_attempt="0"
          fi
          zyte_budget="$(printf '%s\n' "$decision" | sed -n 's/^zyte_budget=//p' | tail -1)"
          if [[ ! "$zyte_budget" =~ ^[0-9]+$ ]]; then
            zyte_budget="60"
          fi
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "reason=${reason:-unknown}" >> "$GITHUB_OUTPUT"
          echo "zyte_budget=$zyte_budget" >> "$GITHUB_OUTPUT"

      - name: Bestaande runner-Chrome selecteren
        if: steps.due.outputs.run_attempt == '1'
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome_path" ]]; then
            echo 'Geen bestaande Chrome/Chromium op de GitHub-runner gevonden.' >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version

      - name: Verschuldigde daily attempt uitvoeren
        if: steps.due.outputs.run_attempt == '1'
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          ZYTE_LISTING_FALLBACK_ENABLED: "1"
          # 60 normaal; inspect:daily schaalt na twee mislukte pogingen vandaag
          # zelf op naar 150 (harde cap in config.mjs).
          ZYTE_LISTING_FALLBACK_MAX_REQUESTS: ${{ steps.due.outputs.zyte_budget }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DAILY_PARTIAL_SNAPSHOT_ENABLED: "1"
          DAILY_PARTIAL_MIN_SKUS: "1000"
          ZYTE_LISTING_FALLBACK_TIMEOUT_MS: "45000"
        run: npm run import:daily

      - name: Retrystatus samenvatten
        if: always()
        run: |
          {
            echo '## Dagelijkse volledige catalogusmaintenance'
            echo "Attempt uitgevoerd: ${{ steps.due.outputs.run_attempt }}"
            echo "Beslissing: ${{ steps.due.outputs.reason }}"
            echo "Zyte-budget: ${{ steps.due.outputs.zyte_budget }}"
            echo 'Een retry beoordeelt opnieuw de volledige actuele listingset; er is geen nieuw-productdoel.'
            echo 'Last-known-good blijft bij een tijdelijke bronstoring beschikbaar.'
          } >> "$GITHUB_STEP_SUMMARY"
