name: TEMPORARY Hoogvliet source probe — READ ONLY

# One public growth-category fetch only. No importer, Supabase, recovery,
# product write, database write, or authenticated/private endpoint.
on:
  workflow_dispatch:
  push:
    branches:
      - codex/fix-highvliet-parser-20261005
    paths:
      - .github/workflows/probe-hoogvliet-source.yml
      - scripts/probe-hoogvliet-source.mjs
      - src/hoogvliet.mjs
      - src/discovery-routes.mjs

permissions:
  contents: read

concurrency:
  group: hoogvliet-source-probe-read-only
  cancel-in-progress: false

jobs:
  probe:
    name: One public Hoogvliet listing probe — READ ONLY
    outputs:
      result_label: ${{ steps.result.outputs.result_label }}
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.repository == 'boodschappenmaatje/Boodschappenmandje-importer' &&
      github.ref == 'refs/heads/codex/fix-highvliet-parser-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Chromium installeren
        run: npx playwright install --with-deps chromium

      - name: Eén actuele openbare bronroute onderzoeken — READ ONLY
        id: run_probe
        continue-on-error: true
        env:
          PROBE_TERM: category:999999-100
          PROBE_OUTPUT: hoogvliet-source-proof.json
        run: |
          set -uo pipefail
          node scripts/probe-hoogvliet-source.mjs | tee hoogvliet-probe.log
          probe_status=${PIPESTATUS[0]}
          cat hoogvliet-probe.log >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No importer, Supabase, recovery, product write, or database write was run.' >> "$GITHUB_STEP_SUMMARY"
          exit "$probe_status"

      - name: Veilige probe-uitkomst als jobmetadata publiceren
        id: result
        if: always()
        run: |
          set -euo pipefail
          result_label=$(node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          try {
            const proof = JSON.parse(readFileSync("hoogvliet-source-proof.json", "utf8"));
            const network = (proof.network ?? [])
              .filter(record => record.type === "xhr" || record.type === "fetch")
              .slice(0, 3)
              .map(record => {
                const endpoint = record.endpoint ?? {};
                const json = record.json ?? {};
                const shape = json.shape && typeof json.shape === "object" && !Array.isArray(json.shape)
                  ? Object.keys(json.shape).slice(0, 20).join(",")
                  : String(json.shape ?? "none");
                return `${record.type}:${record.status}:${endpoint.pathname ?? "?"}?${(endpoint.queryKeys ?? []).join(",")}:objects=${json.productLikeObjects ?? 0}:skus=${(json.uniqueSKUHints ?? []).length}:urls=${(json.productURLHints ?? []).length}:keys=${shape}`;
              })
              .join("|");
            const navigation = proof.navigation ?? {};
            const label = `classification=${proof.proof?.sourceClassification ?? "unknown"};candidates=${proof.proof?.candidateCount ?? 0};status=${navigation.initialStatus ?? "unknown"};title=${String(navigation.title ?? "").slice(0, 60)};network=${network}`;
            process.stdout.write(label.replace(/[\r\n]/g, " ").slice(0, 240));
          } catch {
            process.stdout.write("classification=NO_PROOF;candidates=0");
          }
          NODE
          )
          echo "result_label=$result_label" >> "$GITHUB_OUTPUT"

      - name: Probe-uitkomst zichtbaar maken
        if: always()
        run: echo "${{ steps.result.outputs.result_label }}"

      - name: Bewijsartefact uploaden
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoogvliet-source-proof
          path: |
            hoogvliet-source-proof.json
            hoogvliet-probe.log
          if-no-files-found: error

  result:
    name: ${{ needs.probe.outputs.result_label }}
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Read-only probe metadata is recorded in this job name; no write was performed."
