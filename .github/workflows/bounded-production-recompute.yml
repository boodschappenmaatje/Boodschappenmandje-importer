name: "READ ONLY — NO REPAIR | bounded Production recomputation"

on:
  workflow_dispatch:
    inputs:
      recipe_ids_json:
        description: 'Exacte 7 recipe UUIDs uit de nieuw goedgekeurde actuele Production-scopebaseline.'
        required: true
        default: "[]"
        type: string

permissions:
  contents: read

concurrency:
  group: bounded-production-recompute
  cancel-in-progress: false

jobs:
  bounded-recompute:
    name: "READ ONLY — NO REPAIR"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RECOMPUTE_ARMED: "true"
      RECIPE_IDS_JSON: ${{ inputs.recipe_ids_json }}
      PLANNER_CACHE_BASE_URL: https://boodschappenmaatje-pwa.vercel.app
      PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Repository ophalen
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Node installeren
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The runner itself hard-fails unless RECOMPUTE_ARMED is the literal
      # string "false". Do not add SQL, RPC, repair, or retry steps here.
      - name: Verse Production dry-run en veilige scopevalidatie
        shell: bash
        run: node src/bounded-production-recompute.mjs
