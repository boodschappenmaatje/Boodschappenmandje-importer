name: "READ ONLY — NO REPAIR | bounded Production recomputation"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-production-recompute
  cancel-in-progress: false

jobs:
  bounded-recompute:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'boodschappenmaatje/Boodschappenmandje-importer' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    name: "READ ONLY — NO REPAIR"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLANNER_CACHE_BASE_URL: https://boodschappenmaatje-pwa.vercel.app
      PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Repository ophalen
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Node installeren
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verse Production dry-run en veilige scopevalidatie
        shell: bash
        run: node src/bounded-production-recompute.mjs
