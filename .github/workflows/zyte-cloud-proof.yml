name: Temporary Zyte two-page cloud proof
on:
  push:
    branches:
      - codex/roadmap-1a-1-provider-research
    paths:
      - scripts/zyte-cloud-proof.mjs

permissions:
  contents: read

concurrency:
  group: temporary-zyte-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    if: ${{ !contains(github.event.head_commit.removed, 'scripts/zyte-cloud-proof.mjs') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: secret
        name: Check secret presence only
        shell: bash
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: |
          if [[ -n "$ZYTE_API_KEY" ]]; then
            echo "status=present" >> "$GITHUB_OUTPUT"
            echo "ZYTE_API_KEY=present"
          else
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "ZYTE_API_KEY=missing"
          fi
      - name: Install importer dependencies
        if: steps.secret.outputs.status == 'present'
        run: npm ci
      - name: Install local Chromium parser runtime
        if: steps.secret.outputs.status == 'present'
        run: npx playwright install --with-deps chromium
      - name: Two bounded HTTP-response requests and optional one browserHtml request
        if: steps.secret.outputs.status == 'present'
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: node scripts/zyte-cloud-proof.mjs
