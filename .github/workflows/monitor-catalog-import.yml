name: Dagelijkse Hoogvliet catalogusbewaking

on:
  workflow_dispatch:
  schedule:
    # Dagelijks 08:30 Nederlandse tijd, onafhankelijk van GitHub-startvertraging.
    - cron: "30 8 * * *"
      timezone: "Europe/Amsterdam"

permissions:
  contents: read

concurrency:
  group: hoogvliet-catalog-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CATALOG_MONITOR_MAX_AGE_HOURS: "6"
      CATALOG_MONITOR_GROWTH_TARGET: "400"
      UPDATE_MODE: growth
      CATALOG_BATCH: growth
      DAILY_IMPORT_STATE_KEY: daily-catalog-growth
      DAILY_NEW_PRODUCT_TARGET: "400"

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Dagelijkse import controleren
        run: npm run monitor:catalog

      - name: Bewakingsuitleg
        if: always()
        run: |
          {
            echo '## Dagelijkse catalogusbewaking'
            echo 'Een lopende of geplande retry is normaal herstelgedrag en geldt niet als fout.'
            echo 'Een ontbrekende dagjob wordt veilig klaargezet voor de retry-workflow.'
            echo 'Alleen een niet-herstelbare fout vraagt directe aandacht.'
            echo 'De bestaande catalogus blijft bij iedere waarschuwing beschikbaar.'
          } >> "$GITHUB_STEP_SUMMARY"
