name: Dagelijkse Hoogvliet catalogusbewaking

on:
  workflow_dispatch:
  schedule:
    # Dagelijks 08:30 Nederlandse tijd, onafhankelijk van GitHub-startvertraging.
    - cron: "30 8 * * *"
      timezone: "Europe/Amsterdam"

permissions:
  contents: read

concurrency:
  group: hoogvliet-catalog-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CATALOG_MONITOR_MAX_AGE_HOURS: "6"
      UPDATE_MODE: maintenance
      CATALOG_BATCH: growth

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Dagelijkse import controleren
        run: npm run monitor:catalog

      - name: Bewakingsuitleg
        if: always()
        run: |
          {
            echo '## Dagelijkse catalogusbewaking'
            echo 'Een lopende volledige maintenance-run is gezond.'
            echo 'Een ontbrekende, partiële of mislukte run blijft zichtbaar; de retry-workflow beoordeelt hem opnieuw.'
            echo 'Last-known-good blijft bij iedere bronwaarschuwing beschikbaar.'
          } >> "$GITHUB_STEP_SUMMARY"
