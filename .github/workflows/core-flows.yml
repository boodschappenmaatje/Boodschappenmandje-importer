name: Stability & core flows

on:
  pull_request:
  push:
    branches:
      - main
      # Validate the exact Draft head even while main's ROADMAP conflicts with
      # the existing PR documentation and GitHub cannot build a PR merge ref.
      - feature/meal-mix-supplement-matches
      - 'maintenance/replay-schedule/**'

permissions:
  contents: read

concurrency:
  group: core-flows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Core flows, regressions & production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/web
      # Fixtures/syntax only: no importer entry point, DB, secrets or network data.
      - name: Importer fixtures and seed consistency
        run: npm test && npm run check
      - name: PostgreSQL atomic rollback and concurrency gate
        run: npm run test:postgres
      # Full web suite includes the core subset once, avoiding duplicate runs.
      - name: Web core flows, regressions, lint, TypeScript and build
        run: npm run check --prefix apps/web

  pr55-explicit-sku-dry-run:
    name: PR #55 exact 10-SKU read-only proof
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 55 && github.event.pull_request.head.ref == 'codex/explicit-sku-catch-up-20261007' && github.event.pull_request.head.repo.full_name == 'boodschappenmaatje/Boodschappenmandje-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: hoogvliet-supabase-update
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      HEADLESS: "1"
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing dependencies
        run: npm ci
      - name: Install existing Playwright Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify original 812-SKU input
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum hoogvliet-missing-production-2026-10-06.csv | cut -d' ' -f1)" = "a24da369b15d4ddf0d8741f7aeb4d3fee2f733e74e2d448ec1ffcd1b8ab30246"
          node scripts/pr55-dry-run-proof.mjs verify
      - name: Production read-only precheck
        env:
          NODE_OPTIONS: --import=./scripts/pr55-readonly-fetch-guard.mjs
        run: node scripts/pr55-dry-run-proof.mjs before
      - name: Run exactly the first 10 CSV SKUs in dry-run mode
        shell: bash
        env:
          NODE_OPTIONS: --import=./scripts/pr55-readonly-fetch-guard.mjs
        run: |
          set -euo pipefail
          npm run import:skus -- --file hoogvliet-missing-production-2026-10-06.csv --max 10 --dry-run 2>&1 | tee /tmp/pr55-explicit-sku-output.log
      - name: Verify classifications, no discovery, and zero writes
        env:
          NODE_OPTIONS: --import=./scripts/pr55-readonly-fetch-guard.mjs
        run: node scripts/pr55-dry-run-proof.mjs after /tmp/pr55-explicit-sku-output.log
      - uses: actions/upload-artifact@v4
        with:
          name: pr55-explicit-sku-dry-run-proof
          path: pr55-dry-run-proof.json
          if-no-files-found: error
          retention-days: 14
