name: Temporary Zyte listing proof

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Exactly one provider mode for the same listing URL"
        required: true
        type: choice
        options:
          - browserHtml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: One bounded listing HTTP-response request
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          PROOF_MODE: ${{ inputs.mode }}
        run: node scripts/zyte-listing-proof.mjs
