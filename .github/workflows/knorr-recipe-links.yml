name: Seven reviewed Knorr recipe links

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run by default; write requires the exact confirmation below
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - write
      confirmation:
        description: Required only for write: WRITE_EXACT_7_KNORR_RECIPE_LINKS
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hoogvliet-supabase-update
  cancel-in-progress: false

jobs:
  knorr-recipe-links:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'boodschappenmaatje/Boodschappenmandje-importer' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run fixed seven-record precheck, link write and readiness refresh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          KNORR_LINK_MODE: ${{ inputs.mode }}
          KNORR_LINK_CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PLANNER_CACHE_BASE_URL: https://boodschappenmaatje-pwa.vercel.app
          PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/run-knorr-recipe-links.mjs
