name: Hoogvliet import proof of concept

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoogvliet-import-poc
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MAX_PRODUCTS: "150"
      MAX_PER_TERM: "3"
      SEARCH_TERMS: "gehakt,aardappelen,pasta,pastasaus,brood,melk,cola,chips,pizza,soep,kip,groente,rijst,knorr,kaas,yoghurt,water,koek,patat,bonen,rundergehakt,tomaat,spaghetti,honig,bolletjes,kwark,sinas,chocolade,friet,tomatenblokjes,kipfilet,paprika,macaroni,saus,croissant,boter,frisdrank,snoep,kroket,mais,worst,ui,lasagne,mayonaise,beschuit,margarine,sap,nootjes,frikandel,tonijn,hamburger,komkommer,nasi,ketchup,crackers,room,koffie,snacks,kipnuggets,kruiden,shoarma,wortel,bami,curry,ontbijtgranen,thee,diepvries,bloem,vis,sla,noodles,taco,havermout,limonade,suiker,zalm,broccoli,wraps,maaltijdmix,olie,bloemkool,appel,tortilla,banaan,sinaasappel,fruit"
      HEADLESS: "1"

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Test Supabase verbinding
        run: |
          node -e "
            const base = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_SECRET_KEY;

            if (!base) {
              console.error('SUPABASE_URL ontbreekt');
              process.exit(1);
            }

            if (!key) {
              console.error('SUPABASE_SECRET_KEY ontbreekt');
              process.exit(1);
            }

            const url = base.replace(/\/+$/, '') + '/rest/v1/';

            fetch(url, {
              headers: {
                apikey: key,
                Accept: 'application/json'
              }
            })
            .then(async (response) => {
              const body = await response.text();

              console.log('Supabase host:', new URL(url).host);
              console.log('Supabase HTTP status:', response.status);
              console.log('Supabase response:', body.slice(0, 500));

              if (!response.ok) {
                process.exit(1);
              }
            })
            .catch((error) => {
              console.error('Supabase netwerkfout');
              console.error('name:', error?.name ?? '-');
              console.error('message:', error?.message ?? '-');
              console.error('cause.code:', error?.cause?.code ?? '-');
              console.error('cause.message:', error?.cause?.message ?? '-');
              process.exit(1);
            });
          "

      - name: Dependencies installeren
        run: npm ci

      - name: Chromium installeren
        run: npx playwright install --with-deps chromium

      - name: Technische controles
        run: npm test

      - name: Maximaal 150 producten importeren
        run: npm run import
