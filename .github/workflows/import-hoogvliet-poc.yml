name: Hoogvliet import proof of concept

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoogvliet-import-poc
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MAX_PRODUCTS: "30"
      MAX_PER_TERM: "2"
      SEARCH_TERMS: "gehakt,kip,pasta,rijst,aardappelen,groenten,brood,kaas,melk,yoghurt,frisdrank,koffie,saus,soep,snacks"
      HEADLESS: "1"

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Test Supabase verbinding
        run: |
          node -e "
            const base = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_SECRET_KEY;

            if (!base) {
              console.error('SUPABASE_URL ontbreekt');
              process.exit(1);
            }

            if (!key) {
              console.error('SUPABASE_SECRET_KEY ontbreekt');
              process.exit(1);
            }

            const url = base.replace(/\/+$/, '') + '/rest/v1/';

            fetch(url, {
              headers: {
                apikey: key,
                Accept: 'application/json'
              }
            })
            .then(async (response) => {
              const body = await response.text();

              console.log('Supabase host:', new URL(url).host);
              console.log('Supabase HTTP status:', response.status);
              console.log('Supabase response:', body.slice(0, 500));

              if (!response.ok) {
                process.exit(1);
              }
            })
            .catch((error) => {
              console.error('Supabase netwerkfout');
              console.error('name:', error?.name ?? '-');
              console.error('message:', error?.message ?? '-');
              console.error('cause.code:', error?.cause?.code ?? '-');
              console.error('cause.message:', error?.cause?.message ?? '-');
              process.exit(1);
            });
          "

      - name: Dependencies installeren
        run: npm ci

      - name: Chromium installeren
        run: npx playwright install --with-deps chromium

      - name: Technische controles
        run: npm test

      - name: Maximaal 30 producten importeren
        run: npm run import
