name: Hoogvliet import proof of concept

on:
  workflow_dispatch:
    inputs:
      resume_source_challenge:
        description: Alleen bewezen source_challenge hervatten na cooldown; dagbudget en normale claim blijven verplicht
        type: boolean
        default: false
      daily_attempt_only:
        description: Eén goedgekeurde dagpoging; maximaal resterend dagdoel 400, daarna geen retry
        type: boolean
        default: false
      falafel_e2e_only:
        description: Alleen de expliciet goedgekeurde falafel-E2E; normale importer overslaan
        type: boolean
        default: false
      e2e_test_sku:
        description: Verplicht voor falafel-E2E; uitsluitend 730331000
        type: string
        required: false
        default: ""
      preflight_only:
        description: Alleen planner-auth en Supabase read-only controleren; geen import
        type: boolean
        default: false
      update_mode:
        description: Soort update
        required: true
        default: catalog
        type: choice
        options:
          - catalog
          - growth
          - prices
          - classify
      catalog_batch:
        description: Catalogusbatch
        required: true
        default: core
        type: choice
        options:
          - core
          - fresh
          - world
          - pantry
          - growth
      growth_limit:
        description: 100 vereist daily_attempt_only; eerst 100 + integriteitsgate, uitsluitend groen daarna resterend dagbudget
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "100"
          - "400"
      advance_discovery_state:
        description: Discovery-cursor na deze run doorschuiven
        required: true
        default: true
        type: boolean
      price_shard:
        description: Prijsdeelbatch (auto gebruikt de huidige weekdag)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
  schedule:
    # Dagelijks 06:07 Nederlandse tijd; vermijd de drukke hele-uurgrens.
    # GitHub plant dit direct in Europe/Amsterdam, ook over DST-wisselingen.
    - cron: "7 6 * * *"
      timezone: "Europe/Amsterdam"
    # Dagelijks 02:17 UTC: één van zeven vaste prijsdeelbatches.
    - cron: "17 2 * * *"
    # Zondag 03:43 UTC: één catalogusbatch; core/fresh/world/pantry rouleren.
    - cron: "43 3 * * 0"

permissions:
  contents: read

concurrency:
  group: hoogvliet-supabase-update
  cancel-in-progress: false

jobs:
  preflight:
    permissions: {}
    if: github.event_name == 'workflow_dispatch' && inputs.preflight_only == true && github.repository == 'boodschappenmaatje/Boodschappenmandje-importer' && github.ref == 'refs/heads/fix/planner-new-product-maintenance' && inputs.falafel_e2e_only != true && inputs.e2e_test_sku == ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify configuration, Preview auth, and read-only Supabase access
        shell: bash
        env:
          PLANNER_CACHE_BASE_URL: ${{ vars.PLANNER_CACHE_BASE_URL }}
          PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          // Only the PR #23 branch alias published by the Vercel GitHub bot.
          // Reject production, arbitrary hosts, URL credentials and redirects.
          const previewOrigin = 'https://boodschappenmaatje-pwa-git-fix-planne-a4a7f3-dennisverkaik-4661.vercel.app';
          const projectRef = 'pjcqxufvbkkjehituzxz'; // BoodschappenMaatje
          const supabaseOrigin = `https://${projectRef}.supabase.co`;
          const safeFailures = new Set();
          function fail(code) {
            safeFailures.add(code);
            throw new Error(code);
          }
          function assertOrigin(value, expected, label) {
            let url;
            try { url = new URL(value); } catch { fail(`${label}-invalid-origin`); }
            if (url.origin !== expected || url.username || url.password ||
                url.pathname !== '/' || url.search || url.hash) {
              fail(`${label}-unexpected-origin`);
            }
            return url;
          }
          async function request(url, options, label) {
            try {
              return await fetch(url, {
                ...options,
                redirect: 'manual',
                signal: AbortSignal.timeout(20_000),
              });
            } catch { fail(`${label}-network-error`); }
          }
          async function json(response) {
            if (!response.headers.get('content-type')?.includes('application/json')) return null;
            try { return await response.json(); } catch { return null; }
          }
          try {
            if (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' ||
                process.env.GITHUB_REPOSITORY !== 'boodschappenmaatje/Boodschappenmandje-importer' ||
                process.env.GITHUB_REF !== 'refs/heads/fix/planner-new-product-maintenance') {
              fail('unexpected-workflow-context');
            }
            const keys = ['PLANNER_CACHE_BASE_URL', 'PLANNER_CACHE_ADMIN_TOKEN',
              'SUPABASE_URL', 'SUPABASE_SECRET_KEY', 'VERCEL_AUTOMATION_BYPASS_SECRET'];
            let missing = false;
            for (const key of keys) {
              const configured = Boolean(process.env[key]?.trim());
              console.log(`${key}: ${configured ? 'configured' : 'missing'}`);
              missing ||= !configured;
            }
            if (missing) fail('configuration-missing');

            const preview = assertOrigin(process.env.PLANNER_CACHE_BASE_URL.trim(), previewOrigin, 'preview');
            const supabase = assertOrigin(process.env.SUPABASE_URL.trim(), supabaseOrigin, 'supabase');
            const token = process.env.PLANNER_CACHE_ADMIN_TOKEN.trim();
            const secret = process.env.SUPABASE_SECRET_KEY.trim();
            if (/\s/.test(token)) fail('admin-token-invalid-format');
            const headers = { apikey: secret, accept: 'application/json' };
            // Support the existing legacy service_role key and modern server keys.
            // Never accept an anon/publishable key as evidence of server access.
            if (!/^sb_secret_[A-Za-z0-9_-]+$/.test(secret)) {
              let payload;
              try {
                const parts = secret.split('.');
                if (parts.length !== 3) fail('supabase-server-key-invalid');
                payload = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
              } catch { fail('supabase-server-key-invalid'); }
              if (payload?.role !== 'service_role' || payload?.ref !== projectRef) {
                fail('supabase-server-key-project-or-role-mismatch');
              }
              headers.authorization = `Bearer ${secret}`;
            }
            console.log('Preview origin: expected PR #23 branch alias');
            console.log('Supabase origin: expected BoodschappenMaatje project');

            preview.pathname = '/api/internal/planner-readiness/new-products';
            const auth = await request(preview, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json',
                'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_SECRET.trim() },
              body: '{"productIds":[]}',
            }, 'preview-auth');
            const result = await json(auth);
            // Do not print arbitrary response bodies, headers, errors or URLs.
            const errorCode = result?.error === 'invalid-request' ? 'invalid-request'
              : result?.error === 'unauthorized' ? 'unauthorized' : 'unexpected-response';
            console.log(`Preview auth HTTP: ${auth.status}; code: ${errorCode}`);
            if (auth.status !== 400 || errorCode !== 'invalid-request') fail('preview-auth-failed');
            console.log('Preview auth: passed; empty productIds rejected before database access');

            // One bounded SELECT only; no RPC, SQL, mutations or maintenance calls.
            supabase.pathname = '/rest/v1/recipes';
            supabase.search = '?select=id&limit=1';
            const read = await request(supabase, { method: 'GET', headers }, 'supabase-read');
            console.log(`Supabase read-only HTTP: ${read.status}`);
            if (read.status !== 200) fail('supabase-read-failed');
            const rows = await json(read);
            if (!Array.isArray(rows) || rows.length !== 1 ||
                typeof rows[0]?.id !== 'string' || !rows[0].id) fail('supabase-read-unexpected-response');
            console.log('Supabase read-only check: passed');
            console.log('Preflight passed. Importer writes: 0. Database writes by this workflow: 0.');
          } catch (error) {
            const code = safeFailures.has(error?.message) ? error.message : 'unexpected-preflight-failure';
            console.error(`Preflight failed: ${code}`);
            process.exitCode = 1;
          }
          NODE

  import:
    # Fail closed for both typed boolean and raw workflow_dispatch input.
    if: ${{ inputs.preflight_only != true && github.event.inputs.preflight_only != 'true' && inputs.falafel_e2e_only != true && github.event.inputs.falafel_e2e_only != 'true' && inputs.e2e_test_sku == '' && (github.event.inputs.e2e_test_sku == '' || github.event.inputs.e2e_test_sku == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PLANNER_CACHE_BASE_URL: https://boodschappenmaatje-pwa.vercel.app
      PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      HEADLESS: "1"

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Updateplan bepalen
        shell: bash
        run: |
          set -euo pipefail

          run_import="1"
          import_trigger="manual"
          daily_import_job="0"
          advance_discovery_state="1"
          discovery_state_key="daily-catalog-growth"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "7 6 * * *" ]]; then
              update_mode="growth"
              catalog_batch="growth"
              price_shard="0"
              max_products="400"
              import_trigger="schedule"
              daily_import_job="1"
            elif [[ "${{ github.event.schedule }}" == "17 2 * * *" ]]; then
              update_mode="prices"
              catalog_batch="core"
              price_shard=$((10#$(date -u +%u) - 1))
              max_products="100"
            elif [[ "${{ github.event.schedule }}" == "43 3 * * 0" ]]; then
              update_mode="catalog"
              batches=(core fresh world pantry)
              week=$((10#$(date -u +%V)))
              catalog_batch="${batches[$((week % ${#batches[@]}))]}"
              price_shard="0"
              max_products="180"
            else
              echo "Onbekend automatisch updateschema" >&2
              exit 1
            fi
          else
            update_mode="${{ inputs.update_mode }}"
            catalog_batch="${{ inputs.catalog_batch }}"
            price_shard="${{ inputs.price_shard }}"
            max_products="${{ inputs.growth_limit }}"
            advance_discovery_state="${{ inputs.advance_discovery_state && '1' || '0' }}"
            if [[ "$price_shard" == "auto" ]]; then
              price_shard=$((10#$(date -u +%u) - 1))
            fi
            if [[ "$update_mode" == "growth" ]]; then
              catalog_batch="growth"
            fi
          fi

          # The 100 gate is daily-accounted, never a separate unaccounted test import.
          if [[ "${{ inputs.resume_source_challenge }}" == "true" ]]; then
            if [[ "${{ inputs.daily_attempt_only }}" != "true" || "${{ inputs.growth_limit }}" != "400" ]]; then
              echo "Challengehervatting vereist daily_attempt_only en remaining-budget 400" >&2
              exit 1
            fi
            echo "RESUME_SOURCE_CHALLENGE=1" >> "$GITHUB_ENV"
          fi
          if [[ "${{ inputs.growth_limit }}" == "100" && "${{ inputs.daily_attempt_only }}" != "true" ]]; then
            echo "100 vereist daily_attempt_only" >&2
            exit 1
          fi
          # Explicit one-shot validation uses the existing daily claim.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.daily_attempt_only }}" == "true" ]]; then
            update_mode="growth"
            catalog_batch="growth"
            max_products="400"
            daily_import_job="1"
            import_trigger="schedule"
            advance_discovery_state="1"
            echo "DAILY_SINGLE_ATTEMPT=1" >> "$GITHUB_ENV"
            if [[ "${{ inputs.growth_limit }}" == "100" ]]; then
              echo "DAILY_ACCEPTANCE_GATE=100" >> "$GITHUB_ENV"
            fi
          fi

          if [[ "$update_mode" == "prices" ]]; then
            max_products="100"
          elif [[ "$update_mode" == "catalog" || "$update_mode" == "classify" ]]; then
            max_products="180"
          fi

          if [[ "$update_mode" == "growth" && "$max_products" != "10" && "$max_products" != "400" ]]; then
            echo "Ongeldige groeilimiet: $max_products" >&2
            exit 1
          fi

          {
            echo "RUN_IMPORT=$run_import"
            echo "UPDATE_MODE=$update_mode"
            echo "CATALOG_BATCH=$catalog_batch"
            echo "PRICE_SHARD_COUNT=7"
            echo "PRICE_SHARD_INDEX=$price_shard"
            echo "PRICE_CYCLE_INDEX=$((10#$(date -u +%V) - 1))"
            echo "MAX_PRODUCTS=$max_products"
            echo "MAX_NEW_PRODUCTS=$([[ "$update_mode" == "growth" ]] && echo "$max_products" || echo "100")"
            echo "MAX_PER_TERM=$([[ "$update_mode" == "growth" ]] && echo "40" || echo "20")"
            echo "MAX_PAGES_PER_TERM=$([[ "$update_mode" == "growth" ]] && echo "8" || echo "4")"
            echo "GROWTH_MAX_PAGES_PER_TERM=20"
            echo "GROWTH_MAX_TOTAL_PAGES=800"
            echo "GROWTH_MAX_CANDIDATES=6000"
            echo "GROWTH_MAX_RUNTIME_MINUTES=105"
            echo "NAVIGATION_RETRIES=2"
            echo "SATURATION_MIN_CANDIDATES=40"
            echo "SATURATION_YIELD_PERCENT=5"
            echo "CATALOG_NEW_ONLY=1"
            echo "IMPORT_TRIGGER=$([[ "$update_mode" == "growth" && "$import_trigger" == "manual" ]] && echo "test" || echo "$import_trigger")"
            echo "DISCOVERY_STATE_KEY=$discovery_state_key"
            echo "DAILY_IMPORT_JOB=$daily_import_job"
            echo "DAILY_IMPORT_STATE_KEY=daily-catalog-growth"
            echo "DAILY_NEW_PRODUCT_TARGET=$max_products"
            echo "DAILY_IMPORT_END_HOUR=23"
            echo "ADVANCE_DISCOVERY_STATE=$advance_discovery_state"
            echo "PREFER_NEW_PRODUCTS=$([[ "$update_mode" == "growth" && "$advance_discovery_state" == "0" ]] && echo "0" || echo "1")"
          } >> "$GITHUB_ENV"

          echo "Updateplan: mode=$update_mode, catalogusbatch=$catalog_batch, prijsdeelbatch=$price_shard/6"

      - name: Test Supabase verbinding
        if: env.RUN_IMPORT != '0'
        run: |
          node -e "
            const base = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_SECRET_KEY;

            if (!base) {
              console.error('SUPABASE_URL ontbreekt');
              process.exit(1);
            }

            if (!key) {
              console.error('SUPABASE_SECRET_KEY ontbreekt');
              process.exit(1);
            }

            const url = base.replace(/\/+$/, '') + '/rest/v1/';

            fetch(url, {
              headers: {
                apikey: key,
                Accept: 'application/json'
              }
            })
            .then(async (response) => {
              const body = await response.text();

              console.log('Supabase host:', new URL(url).host);
              console.log('Supabase HTTP status:', response.status);
              console.log('Supabase response:', body.slice(0, 500));

              if (!response.ok) {
                process.exit(1);
              }
            })
            .catch((error) => {
              console.error('Supabase netwerkfout');
              console.error('name:', error?.name ?? '-');
              console.error('message:', error?.message ?? '-');
              console.error('cause.code:', error?.cause?.code ?? '-');
              console.error('cause.message:', error?.cause?.message ?? '-');
              process.exit(1);
            });
          "

      - name: Dependencies installeren
        if: env.RUN_IMPORT != '0'
        run: npm ci

      - name: Chromium installeren
        if: env.RUN_IMPORT != '0'
        run: npx playwright install --with-deps chromium

      - name: Technische controles
        if: env.RUN_IMPORT != '0'
        run: npm test

      - name: Producten en prijzen bijwerken
        if: env.RUN_IMPORT != '0'
        run: |
          if [[ "$DAILY_IMPORT_JOB" == "1" ]]; then
            npm run import:daily
          else
            npm run import
          fi

      - name: Catalogusgroei samenvatten
        if: always() && env.RUN_IMPORT != '0' && env.UPDATE_MODE == 'growth'
        run: |
          {
            echo '## Catalogusgroei'
            echo "Doel: ${MAX_NEW_PRODUCTS} daadwerkelijk nieuwe unieke producten."
            echo 'Alleen bevestigde nieuwe inserts met bevestigde geldige prijs tellen mee.'
            echo 'Bestaande en bijgewerkte SKU’s tellen niet mee voor dit groeidoel.'
            if [[ "$DAILY_IMPORT_JOB" == "1" ]]; then
              echo 'Dit is één attempt binnen de persistente dagjob; gedeeltelijke groei blijft bewaard.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Geplande catalogusrun direct controleren
        if: env.RUN_IMPORT != '0' && env.UPDATE_MODE == 'growth' && env.IMPORT_TRIGGER == 'schedule'
        run: npm run monitor:catalog

  falafel-e2e:
    # Manual PR #23 only. Shares the existing importer concurrency lock above.
    if: github.event_name == 'workflow_dispatch' && (inputs.falafel_e2e_only == true || inputs.e2e_test_sku != '') && github.repository == 'boodschappenmaatje/Boodschappenmandje-importer' && github.ref == 'refs/heads/fix/planner-new-product-maintenance'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FALAFEL_E2E_ONLY: ${{ inputs.falafel_e2e_only }}
      E2E_TEST_SKU: ${{ inputs.e2e_test_sku }}
      PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate explicit single-SKU authorization before dependencies or secrets
        run: node scripts/falafel-e2e.mjs --validate-input
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Chromium installeren
        run: npx --no-install playwright install --with-deps chromium
      - name: Run only the bounded falafel E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PLANNER_CACHE_BASE_URL: ${{ vars.PLANNER_CACHE_BASE_URL }}
          PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/falafel-e2e.mjs
