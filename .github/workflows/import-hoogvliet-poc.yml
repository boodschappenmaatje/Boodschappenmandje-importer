name: Hoogvliet import proof of concept

on:
  # Tijdelijke, strikt branchgebonden validatietrigger voor PWA 8.1. Alleen
  # commits met het expliciete markerwoord starten de live 10 -> 10 -> 400-reeks.
  push:
    branches:
      - pwa-8-1-catalog-growth
  workflow_dispatch:
    inputs:
      update_mode:
        description: Soort update
        required: true
        default: catalog
        type: choice
        options:
          - catalog
          - growth
          - prices
          - classify
      catalog_batch:
        description: Catalogusbatch
        required: true
        default: core
        type: choice
        options:
          - core
          - fresh
          - world
          - pantry
          - growth
      growth_limit:
        description: Veilige limiet voor catalogusgroei (test eerst met 10)
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "400"
      advance_discovery_state:
        description: Discovery-cursor na deze run doorschuiven
        required: true
        default: true
        type: boolean
      price_shard:
        description: Prijsdeelbatch (auto gebruikt de huidige weekdag)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
  schedule:
    # Dagelijks 06:00 Nederlandse tijd. GitHub cron is UTC; de twee mogelijke
    # UTC-uren worden in de planstap tegen Europe/Amsterdam gecontroleerd.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
    # Dagelijks 02:17 UTC: één van zeven vaste prijsdeelbatches.
    - cron: "17 2 * * *"
    # Zondag 03:43 UTC: één catalogusbatch; core/fresh/world/pantry rouleren.
    - cron: "43 3 * * 0"

permissions:
  contents: read

concurrency:
  group: hoogvliet-supabase-update
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      HEADLESS: "1"

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Updateplan bepalen
        shell: bash
        run: |
          set -euo pipefail

          run_import="1"
          import_trigger="manual"
          advance_discovery_state="1"
          discovery_state_key="daily-catalog-growth"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 4 * * *" || "${{ github.event.schedule }}" == "0 5 * * *" ]]; then
              local_hour="$(TZ=Europe/Amsterdam date +%H)"
              if [[ "$local_hour" != "06" ]]; then
                run_import="0"
                update_mode="growth"
                catalog_batch="growth"
                price_shard="0"
                max_products="400"
                echo "DST-poort: deze UTC-run is lokaal ${local_hour}:00 en wordt veilig overgeslagen."
              else
                update_mode="growth"
                catalog_batch="growth"
                price_shard="0"
                max_products="400"
                import_trigger="schedule"
              fi
            elif [[ "${{ github.event.schedule }}" == "17 2 * * *" ]]; then
              update_mode="prices"
              catalog_batch="core"
              price_shard=$((10#$(date -u +%u) - 1))
              max_products="100"
            elif [[ "${{ github.event.schedule }}" == "43 3 * * 0" ]]; then
              update_mode="catalog"
              batches=(core fresh world pantry)
              week=$((10#$(date -u +%V)))
              catalog_batch="${batches[$((week % ${#batches[@]}))]}"
              price_shard="0"
              max_products="180"
            else
              echo "Onbekend automatisch updateschema" >&2
              exit 1
            fi
          else
            update_mode="${{ inputs.update_mode }}"
            catalog_batch="${{ inputs.catalog_batch }}"
            price_shard="${{ inputs.price_shard }}"
            max_products="${{ inputs.growth_limit }}"
            advance_discovery_state="${{ inputs.advance_discovery_state && '1' || '0' }}"
            if [[ "$price_shard" == "auto" ]]; then
              price_shard=$((10#$(date -u +%u) - 1))
            fi
            if [[ "$update_mode" == "growth" ]]; then
              catalog_batch="growth"
            fi
          fi

          if [[ "$update_mode" == "prices" ]]; then
            max_products="100"
          elif [[ "$update_mode" == "catalog" || "$update_mode" == "classify" ]]; then
            max_products="180"
          fi

          if [[ "$update_mode" == "growth" && "$max_products" != "10" && "$max_products" != "400" ]]; then
            echo "Ongeldige groeilimiet: $max_products" >&2
            exit 1
          fi

          {
            echo "RUN_IMPORT=$run_import"
            echo "UPDATE_MODE=$update_mode"
            echo "CATALOG_BATCH=$catalog_batch"
            echo "PRICE_SHARD_COUNT=7"
            echo "PRICE_SHARD_INDEX=$price_shard"
            echo "PRICE_CYCLE_INDEX=$((10#$(date -u +%V) - 1))"
            echo "MAX_PRODUCTS=$max_products"
            echo "MAX_NEW_PRODUCTS=$([[ "$update_mode" == "growth" ]] && echo "$max_products" || echo "100")"
            echo "MAX_PER_TERM=$([[ "$update_mode" == "growth" ]] && echo "4" || echo "20")"
            echo "MAX_PAGES_PER_TERM=$([[ "$update_mode" == "growth" ]] && echo "8" || echo "4")"
            echo "CATALOG_NEW_ONLY=$([[ "$update_mode" == "growth" ]] && echo "0" || echo "1")"
            echo "IMPORT_TRIGGER=$([[ "$update_mode" == "growth" && "$import_trigger" == "manual" ]] && echo "test" || echo "$import_trigger")"
            echo "DISCOVERY_STATE_KEY=$discovery_state_key"
            echo "ADVANCE_DISCOVERY_STATE=$advance_discovery_state"
            echo "PREFER_NEW_PRODUCTS=$([[ "$update_mode" == "growth" && "$advance_discovery_state" == "0" ]] && echo "0" || echo "1")"
          } >> "$GITHUB_ENV"

          echo "Updateplan: mode=$update_mode, catalogusbatch=$catalog_batch, prijsdeelbatch=$price_shard/6"

      - name: Test Supabase verbinding
        if: env.RUN_IMPORT != '0'
        run: |
          node -e "
            const base = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_SECRET_KEY;

            if (!base) {
              console.error('SUPABASE_URL ontbreekt');
              process.exit(1);
            }

            if (!key) {
              console.error('SUPABASE_SECRET_KEY ontbreekt');
              process.exit(1);
            }

            const url = base.replace(/\/+$/, '') + '/rest/v1/';

            fetch(url, {
              headers: {
                apikey: key,
                Accept: 'application/json'
              }
            })
            .then(async (response) => {
              const body = await response.text();

              console.log('Supabase host:', new URL(url).host);
              console.log('Supabase HTTP status:', response.status);
              console.log('Supabase response:', body.slice(0, 500));

              if (!response.ok) {
                process.exit(1);
              }
            })
            .catch((error) => {
              console.error('Supabase netwerkfout');
              console.error('name:', error?.name ?? '-');
              console.error('message:', error?.message ?? '-');
              console.error('cause.code:', error?.cause?.code ?? '-');
              console.error('cause.message:', error?.cause?.message ?? '-');
              process.exit(1);
            });
          "

      - name: Dependencies installeren
        if: env.RUN_IMPORT != '0'
        run: npm ci

      - name: Chromium installeren
        if: env.RUN_IMPORT != '0'
        run: npx playwright install --with-deps chromium

      - name: Technische controles
        if: env.RUN_IMPORT != '0'
        run: npm test

      - name: Producten en prijzen bijwerken
        if: env.RUN_IMPORT != '0'
        run: npm run import

  pwa81-live-validation:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[pwa81-live-validation]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      HEADLESS: "1"
      UPDATE_MODE: growth
      CATALOG_BATCH: growth
      MAX_PER_TERM: "4"
      MAX_PAGES_PER_TERM: "8"
      CATALOG_NEW_ONLY: "0"
      IMPORT_TRIGGER: test
      DISCOVERY_STATE_KEY: pwa-8-1-live-validation

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Chromium installeren
        run: npx playwright install --with-deps chromium

      - name: Technische controles
        run: npm test

      - name: Veilige live validatie 10 → 10 → maximaal 400
        shell: bash
        run: |
          set -euo pipefail

          assert_latest_run() {
            local phase="$1"
            local limit="$2"
            local require_zero_new="$3"

            PHASE="$phase" LIMIT="$limit" REQUIRE_ZERO_NEW="$require_zero_new" node <<'NODE'
          import fs from 'node:fs';

          const base = new URL(process.env.SUPABASE_URL);
          base.pathname = '/rest/v1/catalog_import_runs';
          base.searchParams.set('select', '*');
          base.searchParams.set('trigger', 'eq.test');
          base.searchParams.set('order', 'started_at.desc');
          base.searchParams.set('limit', process.env.PHASE === 'repeat-10' ? '2' : '1');

          const key = process.env.SUPABASE_SECRET_KEY;
          const headers = { apikey: key, Accept: 'application/json' };
          if (key.startsWith('eyJ')) headers.Authorization = `Bearer ${key}`;

          const response = await fetch(base, { headers });
          if (!response.ok) throw new Error(`Importstatus lezen mislukt: HTTP ${response.status}`);
          const runs = await response.json();
          const run = runs[0];
          if (!run) throw new Error('Geen catalog_import_runs-record gevonden.');

          const sum = Number(run.new_count) + Number(run.updated_count)
            + Number(run.unchanged_count) + Number(run.skipped_count) + Number(run.error_count);
          const limit = Number(process.env.LIMIT);
          if (run.status !== 'success') throw new Error(`${process.env.PHASE}: status=${run.status}`);
          if (Number(run.error_count) !== 0) throw new Error(`${process.env.PHASE}: fouten=${run.error_count}`);
          if (Number(run.processed_count) < 1 || Number(run.processed_count) > limit) {
            throw new Error(`${process.env.PHASE}: verwerkt=${run.processed_count}, limiet=${limit}`);
          }
          if (Number(run.processed_count) !== sum) {
            throw new Error(`${process.env.PHASE}: statistieken tellen niet op (${run.processed_count} != ${sum})`);
          }
          if (process.env.REQUIRE_ZERO_NEW === '1' && Number(run.new_count) !== 0) {
            throw new Error(`${process.env.PHASE}: idempotentietest maakte ${run.new_count} nieuwe records`);
          }
          if (process.env.PHASE === 'repeat-10') {
            const first = runs[1];
            if (!first) throw new Error('Eerste 10-productenrun ontbreekt.');
            if (Number(run.total_unique_products_before) !== Number(first.total_unique_products_after)
              || Number(run.total_unique_products_after) !== Number(first.total_unique_products_after)) {
              throw new Error('Idempotentietest wijzigde het unieke producttotaal kunstmatig.');
            }
          }

          const summary = `| ${process.env.PHASE} | ${run.processed_count} | ${run.new_count} | ${run.updated_count} | ${run.unchanged_count} | ${run.skipped_count} | ${run.error_count} | ${run.total_unique_products_before} | ${run.total_unique_products_after} | ${run.duration_seconds}s |`;
          console.log(`PWA81_RESULT ${process.env.PHASE} ${JSON.stringify(run)}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE
          }

          {
            echo '## PWA 8.1 live importvalidatie'
            echo '| Fase | Verwerkt | Nieuw | Bijgewerkt | Ongewijzigd | Overgeslagen | Fouten | Voor | Na | Duur |'
            echo '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|'
          } >> "$GITHUB_STEP_SUMMARY"

          export MAX_PRODUCTS="10" MAX_NEW_PRODUCTS="10" ADVANCE_DISCOVERY_STATE="0" PREFER_NEW_PRODUCTS="0"
          npm run import
          assert_latest_run "first-10" "10" "0"

          npm run import
          assert_latest_run "repeat-10" "10" "1"

          export MAX_PRODUCTS="400" MAX_NEW_PRODUCTS="400" ADVANCE_DISCOVERY_STATE="1" PREFER_NEW_PRODUCTS="1"
          npm run import
          assert_latest_run "max-400" "400" "0"
