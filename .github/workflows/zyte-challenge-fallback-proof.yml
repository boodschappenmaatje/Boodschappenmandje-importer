name: Temporary Zyte challenge fallback proof

on:
  push:
    branches:
      - codex/roadmap-1a-1-provider-research
    paths:
      - scripts/zyte-challenge-fallback-proof.mjs

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: One normal fetch and conditional one Zyte HTTP fallback
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: node scripts/zyte-challenge-fallback-proof.mjs
