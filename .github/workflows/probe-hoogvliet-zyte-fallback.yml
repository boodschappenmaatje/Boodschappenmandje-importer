name: TEMPORARY Zyte HTTP listing fallback — one request

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyte-one-shot-hoogvliet-fallback
  cancel-in-progress: false

jobs:
  probe:
    name: One exact Hoogvliet URL via Zyte HTTP response — READ ONLY
    if: github.event_name == 'workflow_dispatch' && github.repository == 'boodschappenmaatje/Boodschappenmandje-importer' && github.ref == 'refs/heads/codex/fix-highvliet-parser-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Parserbrowser installeren (geen bronrequest)
        run: npx playwright install --with-deps chromium

      - name: Exact één Zyte HTTP-response request en read-only analyse
        shell: bash
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          node scripts/probe-hoogvliet-zyte-fallback.mjs
