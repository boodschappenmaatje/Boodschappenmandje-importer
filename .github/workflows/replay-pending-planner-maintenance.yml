name: Replay pending planner maintenance

on:
  workflow_dispatch:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  replay:
    if: >-
      github.repository == 'boodschappenmaatje/Boodschappenmandje-importer' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.number == 33 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'fix/isolated-planner-maintenance-replay' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.changes.body.from != null &&
        contains(github.event.pull_request.body, format('[pending-replay-head:{0}]', github.event.pull_request.head.sha)) &&
        ((!contains(github.event.changes.body.from, '[pending-replay-acceptance:once]') &&
          contains(github.event.pull_request.body, '[pending-replay-acceptance:once]') &&
          !contains(github.event.pull_request.body, '[pending-replay-scheduling:once]')) ||
         (!contains(github.event.changes.body.from, '[pending-replay-scheduling:once]') &&
          contains(github.event.pull_request.body, '[pending-replay-scheduling:once]') &&
          !contains(github.event.pull_request.body, '[pending-replay-acceptance:once]')))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A dry run cannot call maintenance and must not wait behind a live import.
    # Live replay still shares the import lock; skipped PR edits acquire neither.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[pending-replay-scheduling:once]') && 'hoogvliet-maintenance-scheduling' || 'hoogvliet-supabase-update' }}
      cancel-in-progress: false
    steps:
      - name: Scheduling only — no checkout, secrets, or maintenance
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[pending-replay-scheduling:once]')
        run: "echo 'scheduling-only: no database request, maintenance call, or import'"
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, '[pending-replay-acceptance:once]')
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, '[pending-replay-acceptance:once]')
        with:
          node-version: '22'
      - name: Offer one pending maintenance batch (maximum 20)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, '[pending-replay-acceptance:once]')
        run: node scripts/replay-pending-planner-maintenance.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
