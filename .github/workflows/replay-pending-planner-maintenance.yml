name: Replay pending planner maintenance

on:
  push:
    branches:
      - 'maintenance/replay-schedule/**'
      - 'maintenance/replay-live/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  replay:
    if: >-
      github.repository == 'boodschappenmaatje/Boodschappenmandje-importer' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      (startsWith(github.ref, 'refs/heads/maintenance/replay-schedule/') ||
       startsWith(github.ref, 'refs/heads/maintenance/replay-live/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/heads/maintenance/replay-schedule/') && 'hoogvliet-maintenance-scheduling' || 'hoogvliet-supabase-update' }}
      cancel-in-progress: false
    steps:
      - name: Validate exact PR head and one-time branch
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = 'refs/heads/maintenance/replay-';
            const ref = context.ref;
            const sha = context.sha;
            const schedule = new RegExp('^' + prefix + 'schedule/([0-9a-f]{40})$');
            const live = new RegExp('^' + prefix + 'live/([0-9a-f]{40})/(\\d{1,3})$');
            const dry = ref.match(schedule);
            const active = ref.match(live);
            if ((!dry && !active) || (dry || active)[1] !== sha) {
              core.setFailed('replay-ref-or-sha-invalid');
              return;
            }
            const pr = (await github.rest.pulls.get({
              owner: 'boodschappenmaatje', repo: 'Boodschappenmandje-importer', pull_number: 33,
            })).data;
            if (pr.state !== 'open' || !pr.draft ||
                pr.head.sha !== sha ||
                pr.head.ref !== 'fix/isolated-planner-maintenance-replay' ||
                pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo ||
                pr.base.ref !== 'main') {
              core.setFailed('replay-pr-head-invalid');
              return;
            }
            if (active) {
              const expected = Number(active[2]);
              if (!Number.isSafeInteger(expected) || expected < 1 || expected > 290) {
                core.setFailed('replay-pending-count-invalid');
                return;
              }
              core.setOutput('expected_pending_count', String(expected));
            }
            core.setOutput('mode', dry ? 'schedule' : 'live');
      - name: Scheduling only — no checkout, secrets, or maintenance
        if: steps.gate.outputs.mode == 'schedule'
        run: "echo 'scheduling-only: no database request, maintenance call, or import'"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.mode == 'live'
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.mode == 'live'
        with:
          node-version: '22'
      - name: Offer one pending maintenance batch (maximum 20)
        if: steps.gate.outputs.mode == 'live'
        run: node scripts/replay-pending-planner-maintenance.mjs
        env:
          REPLAY_EXPECTED_PENDING_COUNT: ${{ steps.gate.outputs.expected_pending_count }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PLANNER_CACHE_ADMIN_TOKEN: ${{ secrets.PLANNER_CACHE_ADMIN_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
